<!doctype html>
<html lang="en">
<head>
<title>{% block title %}Playlist Sync{% endblock %}</title>
{% include "_head.html" %}
</head>
<body>
<header class="top">
  <a class="brand" href="/"><img src="/static/favicon.svg" alt="">Playlist Sync</a>
  <div class="top-right">
    <nav class="pills" aria-label="Status" data-live="/partials/nav">
{% include "_nav.html" %}
    </nav>
    {% include "_theme.html" %}
  </div>
</header>
<main>
{% block crumbs %}
  <nav class="crumbs" aria-label="Breadcrumb"><a href="/" class="back">&larr; All playlists</a>{% block crumb_here %}{% endblock %}</nav>
{% endblock %}
{% block content %}{% endblock %}
</main>
<script src="/static/poll.js" defer></script>
<script src="/static/theme.js" defer></script>
</body>
</html>
